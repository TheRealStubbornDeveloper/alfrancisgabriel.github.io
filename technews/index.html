<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Tech News — StubbornDev</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:#00ff8844;color:#fff}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050505;color:#c0c0c0;min-height:100vh;padding:24px;overflow-x:hidden}
code,.font-mono{font-family:'JetBrains Mono',monospace}
.container{max-width:800px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.04)}
header h1{font-size:20px;font-weight:700;color:#e0e0e0;letter-spacing:-0.5px}
header h1 .accent{color:#00ff88}
header .subtitle{font-size:11px;color:#6a6a7a;margin-top:3px}
header .back-link a{color:#00aa55;text-decoration:none;font-size:12px}
header .back-link a:hover{color:#00ff88}
.source-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.source-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:rgba(24,24,36,.4);color:#6a6a7a;font-size:11px;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.source-btn:hover{border-color:#00ff8844;color:#c0c0c0}
.source-btn.active{background:#00ff8822;border-color:#00ff8844;color:#00ff88}
.news-list{display:flex;flex-direction:column;gap:8px}
.news-card{background:rgba(24,24,36,.4);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:14px 16px;transition:all .15s;cursor:pointer}
.news-card:hover{border-color:rgba(0,255,136,.2);background:rgba(24,24,36,.6)}
.news-card h3{font-size:13px;font-weight:600;color:#e0e0e0;margin-bottom:4px;line-height:1.4}
.news-card .meta{font-size:10px;color:#6a6a7a;display:flex;gap:10px;flex-wrap:wrap}
.news-card .meta .source{color:#00aa55}
.news-card .meta .date{font-family:'JetBrains Mono',monospace}
.news-card .desc{font-size:11px;color:#6a6a7a;margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status-bar{display:flex;justify-content:space-between;font-size:10px;color:#6a6a7a;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
.loading{text-align:center;padding:40px;color:#6a6a7a;font-size:12px}
.loading .spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.06);border-top-color:#00ff88;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:30px;color:#ff446688}
footer{text-align:center;font-size:11px;color:#6a6a7a;padding:18px 0;margin-top:24px;border-top:1px solid rgba(255,255,255,.04)}
footer a{color:#00aa55;text-decoration:none}
footer a:hover{color:#00ff88}
@media(max-width:600px){body{padding:14px}.source-bar{gap:4px}.source-btn{font-size:10px;padding:4px 8px}}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1><span class="accent">tech</span>news</h1>
<div class="subtitle">PH tech from RSS feeds</div>
</div>
<div class="back-link"><a href="/">← portfolio</a></div>
</header>

<div class="status-bar">
<span><span id="feedCount">0 feeds</span></span>
<span id="updatedText">—</span>
</div>

<div class="source-bar" id="sourceBar"></div>

<div class="news-list" id="newsList">
<div class="loading"><div class="spin"></div>Loading feeds...</div>
</div>

<footer><a href="https://github.com/TheRealStubbornDeveloper">@TheRealStubbornDeveloper</a></footer>
</div>

<script>
var FEEDS = [
  { id: 'bitpinas', name: 'BitPinas', url: 'https://bitpinas.com/feed/' },
  { id: 'yugatech', name: 'YugaTech', url: 'https://www.yugatech.com/feed/' },
  { id: 'gizguide', name: 'GIZGUIDE', url: 'https://www.gizguide.com/feed/' },
  { id: 'mbtech', name: 'MB Tech', url: 'https://mb.com.ph/feed/category/technology' },
  { id: 'rappler', name: 'Rappler Tech', url: 'https://feeds.rappler.com/rappler/technology' }
];

var CORS_PROXY = 'https://api.allorigins.win/get?url=';
// Also have a backup proxy
var CORS_PROXY_BACKUP = 'https://corsproxy.io/?';

var state = {
  articles: [],
  activeSource: null,
  loaded: {}
};

function fmtTime(d) {
  var now = new Date();
  var diff = (now - d) / 1000;
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return d.toLocaleDateString();
}

function parseRSS(text, feedId) {
  var xml = new DOMParser().parseFromString(text, 'text/xml');
  if (!xml) return [];
  var items = xml.querySelectorAll('item');
  if (!items.length) items = xml.querySelectorAll('entry');
  var results = [];
  items.forEach(function(item) {
    var title = (item.querySelector('title') || {}).textContent || '';
    var link = (item.querySelector('link') || {}).textContent || '';
    // link might be in href attribute for Atom
    if (!link) link = (item.querySelector('link') || {}).getAttribute('href') || '';
    var desc = (item.querySelector('description') || {}).textContent || (item.querySelector('summary') || {}).textContent || '';
    // Strip HTML from desc
    desc = desc.replace(/<[^>]*>/g, '').trim();
    var pubDate = (item.querySelector('pubDate') || item.querySelector('published') || item.querySelector('updated') || {}).textContent || '';
    var date = new Date(pubDate);
    if (isNaN(date.getTime())) date = new Date();
    var feedName = FEEDS.find(function(f) { return f.id === feedId; });
    results.push({
      title: title,
      link: link,
      desc: desc.slice(0, 300),
      date: date,
      source: feedName ? feedName.name : feedId,
      sourceId: feedId
    });
  });
  return results;
}

async function fetchFeed(feed) {
  // Try primary proxy
  try {
    var r = await fetch(CORS_PROXY + encodeURIComponent(feed.url), { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    if (data && data.contents) {
      return parseRSS(data.contents, feed.id);
    }
  } catch(e) {
    console.log(feed.id + ' primary proxy failed:', e.message);
  }
  // Try backup proxy
  try {
    var r2 = await fetch(CORS_PROXY_BACKUP + encodeURIComponent(feed.url), { signal: AbortSignal.timeout(10000) });
    if (!r2.ok) throw new Error('HTTP ' + r2.status);
    var text = await r2.text();
    return parseRSS(text, feed.id);
  } catch(e2) {
    console.log(feed.id + ' backup proxy failed:', e2.message);
  }
  return [];
}

async function loadAllFeeds() {
  var allArticles = [];
  var loaded = 0;
  for (var i = 0; i < FEEDS.length; i++) {
    var feed = FEEDS[i];
    if (state.activeSource && feed.id !== state.activeSource) continue;
    try {
      var articles = await fetchFeed(feed);
      allArticles = allArticles.concat(articles);
      loaded++;
      state.loaded[feed.id] = true;
    } catch(e) {
      console.log('Failed ' + feed.id + ':', e);
    }
  }
  // Sort by date descending
  allArticles.sort(function(a, b) { return b.date - a.date; });
  state.articles = allArticles;
  document.getElementById('feedCount').textContent = loaded + '/' + (state.activeSource ? 1 : FEEDS.length) + ' feeds loaded';
  return allArticles;
}

function renderSourceBar() {
  var bar = document.getElementById('sourceBar');
  var html = '<button class="source-btn' + (!state.activeSource ? ' active' : '') + '" data-source="">All</button>';
  FEEDS.forEach(function(f) {
    html += '<button class="source-btn' + (state.activeSource === f.id ? ' active' : '') + '" data-source="' + f.id + '">' + f.name + '</button>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.source-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var src = this.getAttribute('data-source');
      state.activeSource = src || null;
      renderSourceBar();
      var list = document.getElementById('newsList');
      list.innerHTML = '<div class="loading"><div class="spin"></div>Loading...</div>';
      refresh();
    });
  });
}

function render(articles) {
  var list = document.getElementById('newsList');
  if (articles.length === 0) {
    list.innerHTML = '<div class="loading">No articles found. Feeds may be CORS-blocked.</div>';
    return;
  }
  list.innerHTML = articles.map(function(a) {
    var dateStr = a.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var timeStr = a.date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return '<a href="' + a.link + '" target="_blank" class="news-card" rel="noopener">' +
      '<h3>' + escapeHtml(a.title) + '</h3>' +
      (a.desc ? '<div class="desc">' + escapeHtml(a.desc) + '</div>' : '') +
      '<div class="meta"><span class="source">' + a.source + '</span><span class="date">' + dateStr + ' ' + timeStr + '</span></div>' +
      '</a>';
  }).join('');
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

async function refresh() {
  try {
    var articles = await loadAllFeeds();
    render(articles);
    document.getElementById('updatedText').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('newsList').innerHTML = '<div class="error">Failed to load: ' + escapeHtml(e.message) + '</div>';
  }
}

renderSourceBar();
refresh();
// Refresh every 5 min
setInterval(refresh, 300000);
</script>
</body>
</html>
