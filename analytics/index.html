<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StubbornDeveloper · Repo Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>:root{--bg:#0a0a0f;--card:#12121a;--border:#1a1a2e;--accent:#00ff88;--accent-dim:#00aa55;--text:#c8c8d4;--text-dim:#6a6a7a;--red:#ff4466;--blue:#4488ff;--yellow:#ffcc44}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}.container{max-width:1280px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--border)}header h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-0.5px}header h1 span{color:var(--text)}header .subtitle{font-size:13px;color:var(--text-dim);margin-top:4px}header .back-link{font-size:13px}header .back-link a{color:var(--accent-dim);text-decoration:none}header .back-link a:hover{color:var(--accent)}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}.summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.summary-card .value{font-size:24px;font-weight:700;color:#fff}.summary-card .accent{color:var(--accent)}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}.card h3{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}.chart-wrap{position:relative;height:260px}.repos-section h2{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--accent)}.repo-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}.repo-row{display:grid;grid-template-columns:2fr 80px 80px 100px 50px;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .15s}.repo-row:last-child{border-bottom:none}.repo-row:hover{background:rgba(0,255,136,.03)}.repo-row.header{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;cursor:default}.repo-row.header:hover{background:transparent}.repo-name{font-weight:600;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.repo-desc{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.repo-stat{font-size:12px;text-align:center}.repo-stat .num{color:#fff;font-weight:600}.repo-star{color:var(--yellow)}.repo-lang{font-size:11px;text-align:center;color:var(--text-dim)}.detail-panel{display:none;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);padding:16px 20px;grid-template-columns:1fr 1fr;gap:16px}.detail-panel.active{display:grid}.detail-panel h4{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}.detail-chart{position:relative;height:140px}.lang-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lang-tags span{font-size:10px;color:var(--text-dim)}.lang-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}.loading{text-align:center;padding:60px 20px;color:var(--text-dim)}.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;font-size:11px;color:var(--text-dim);padding:20px 0;margin-top:28px;border-top:1px solid var(--border)}footer a{color:var(--accent-dim);text-decoration:none}@media(max-width:700px){.chart-grid{grid-template-columns:1fr}.repo-row{grid-template-columns:1.5fr 60px 60px 70px}.repo-row .repo-stat.repo-link-col{display:none}.detail-panel.active{grid-template-columns:1fr}body{padding:16px}.summary-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>gh:<span>stubborn</span> <span style="color:var(--text-dim)">⸱</span> <span style="color:var(--accent)">analytics</span></h1>
<div class="subtitle">Updated <span id="update-time">—</span></div>
</div>
<div class="back-link"><a href="/">← portfolio</a></div>
</header>
<div class="summary-grid" id="summaryGrid"></div>
<div class="chart-grid">
<div class="card"><h3>Languages</h3><div class="chart-wrap"><canvas id="langChart"></canvas></div></div>
<div class="card"><h3>Stars per Repository</h3><div class="chart-wrap"><canvas id="starsChart"></canvas></div></div>
</div>
<div class="repos-section">
<h2 id="repoCount">Repositories</h2>
<div class="repo-table" id="repoTable"></div>
</div>
<footer><a href="https://github.com/TheRealStubbornDeveloper" target="_blank">@TheRealStubbornDeveloper</a></footer>
</div>
<script>
const LANG_COLORS={Python:'#3572A5',JavaScript:'#f1e05a',TypeScript:'#3178C6',HTML:'#e34c26',CSS:'#563d7c',SCSS:'#c6538c',Kotlin:'#A97BFF',Go:'#00ADD8',Java:'#b07219',C:'#555','C++':'#f34b7d',PHP:'#4F5D95',Shell:'#89e051',Dockerfile:'#384d54','Jupyter Notebook':'#DA5B0F',Rust:'#dea584'};
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);
async function loadJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(url+' → '+r.status);return r.json()}
function renderSummary(s){document.getElementById('update-time').textContent=(s.updated_at||'').slice(0,10)||'—';document.getElementById('summaryGrid').innerHTML=`
<div class=summary-card><div class=label>Repos</div><div class=value>${s.total_repos}</div></div>
<div class=summary-card><div class=label>Stars</div><div class="value accent">${fmt(s.total_stars)}</div></div>
<div class=summary-card><div class=label>Forks</div><div class=value>${fmt(s.total_forks)}</div></div>
<div class=summary-card><div class=label>Top Language</div><div class="value accent">${s.top_language||'—'}</div></div>
<div class=summary-card><div class=label>Languages</div><div class=value>${s.languages_used}</div></div>
<div class=summary-card><div class=label>Size</div><div class=value>${s.total_size_mb}MB</div></div>`.trim()}
function renderLangChart(langs){new Chart(document.getElementById('langChart'),{type:'doughnut',data:{labels:langs.map(l=>l.name),datasets:[{data:langs.map(l=>l.bytes),backgroundColor:langs.map(l=>LANG_COLORS[l.name]||'#666'),borderColor:'#12121a',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#c8c8d4',font:{size:11},padding:10,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>{const l=langs[ctx.dataIndex];return' '+l.name+': '+(l.bytes/1024).toFixed(0)+' KB ('+l.pct+'%)'}}}}}})}
function renderStarsChart(repos){const top15=repos.slice(0,15);new Chart(document.getElementById('starsChart'),{type:'bar',data:{labels:top15.map(r=>r.name.length>16?r.name.slice(0,14)+'…':r.name),datasets:[{label:'Stars',data:top15.map(r=>r.stars),backgroundColor:top15.map(r=>r.stars>0?'#00ff88':'#1a3a2a'),borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6a6a7a',font:{size:10}},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#c8c8d4',font:{size:10}},grid:{display:false}}}}})}
async function showDetail(repo,rowEl){document.querySelectorAll('.detail-panel.active').forEach(p=>p.classList.remove('active'));let panel=rowEl.nextElementSibling;if(!panel||!panel.classList.contains('detail-panel')){panel=document.createElement('div');panel.className='detail-panel';rowEl.after(panel)}
panel.innerHTML='<div class=loading><div class=spin></div></div>';panel.classList.add('active');try{const url='https://api.github.com/repos/TheRealStubbornDeveloper/'+repo.name+'/languages';const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const raw=await r.json();const total=Object.values(raw).reduce((a,b)=>a+b,0);const langs=Object.entries(raw).map(([name,bytes])=>({name,bytes,pct:total?Math.round(bytes/total*100):0})).sort((a,b)=>b.bytes-a.bytes)
panel.innerHTML=`
<div><h4>Languages</h4><div class=detail-chart><canvas id=dl-${repo.name}></canvas></div>
<div class=lang-tags>${langs.slice(0,8).map(l=>'<span><span class=lang-dot style=background:'+(LANG_COLORS[l.name]||'#666')+'></span>'+l.name+' '+l.pct+'%</span>').join('')}</div></div>
<div><h4>About</h4><p style="font-size:12px;color:var(--text-dim);line-height:1.5">${repo.description||'No description'}</p>
<p style="margin-top:8px;font-size:11px;color:var(--text-dim)">Created ${(repo.created_at||'').slice(0,10)} · Updated ${(repo.updated_at||'').slice(0,10)}</p>
<p style="margin-top:4px"><a href="${repo.url}" target="_blank" style="color:var(--accent-dim);font-size:12px">github.com/${repo.name} ↗</a></p></div>`;const ctx=document.getElementById('dl-'+repo.name);if(ctx&&langs.length){new Chart(ctx.getContext('2d'),{type:'doughnut',data:{labels:langs.map(l=>l.name),datasets:[{data:langs.map(l=>l.bytes),backgroundColor:langs.map(l=>LANG_COLORS[l.name]||'#666'),borderColor:'rgba(0,0,0,0.3)',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}}
catch(e){panel.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--red)">Failed to load details</div>'}}
function renderRepoTable(repos){document.getElementById('repoCount').textContent='Repositories ('+repos.length+')';const rows=['<div class="repo-row header"><div>Repository</div><div style=text-align:center>Stars</div><div style=text-align:center>Forks</div><div style=text-align:center>Language</div><div></div></div>'];for(const r of repos){rows.push('<div class=repo-row data-repo=\''+encodeURIComponent(JSON.stringify(r))+'\'><div><div class=repo-name>'+r.name+'</div><div class=repo-desc>'+(r.description||'—')+'</div></div><div class="repo-stat repo-star"><span class=num>'+r.stars+'</span></div><div class=repo-stat><span class=num>'+r.forks+'</span></div><div class=repo-lang>'+r.language+'</div><div class=repo-stat style=font-size:11px;color:var(--accent-dim)>↗</div></div>')}
document.getElementById('repoTable').innerHTML=rows.join('');document.querySelectorAll('.repo-row:not(.header)').forEach(row=>{row.addEventListener('click',e=>{const repo=JSON.parse(decodeURIComponent(row.dataset.repo));showDetail(repo,row)})})}
async function init(){try{const[summary,repos,langs]=await Promise.all([loadJSON('data/summary.json'),loadJSON('data/repos.json'),loadJSON('data/languages.json')]);renderSummary(summary);renderLangChart(langs);renderStarsChart(repos);renderRepoTable(repos)}catch(e){document.querySelector('.container').innerHTML='<div style="text-align:center;padding:80px 20px"><h2 style="color:var(--red);margin-bottom:12px">Data not loaded</h2><p style="color:var(--text-dim)">'+e.message+'</p><p style="margin-top:8px;color:var(--text-dim);font-size:13px">Run python3 scripts/fetch-data.py first</p></div>'}}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
