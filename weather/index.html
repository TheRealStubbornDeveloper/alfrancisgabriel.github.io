<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Weather · Stubborn</title>
<style>
:root{--bg:#0a0a1a;--card:#12122a;--border:#1e1e3a;--accent:#00ff88;--text:#d0d0e0;--text-dim:#6a6a8a;--warm:#ff8844;--cold:#66bbff;--rain:#4488ff;--storm:#ff4466}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border)}
header h1{font-size:22px;color:var(--accent)}header h1 span{color:var(--text-dim);font-weight:400}
header .sub{font-size:12px;color:var(--text-dim);margin-top:3px}
header a{color:var(--accent);text-decoration:none;font-size:13px}
.cities-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.city-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .2s}
.city-card:hover{border-color:var(--accent)}
.city-card .name{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}
.city-card .region{font-size:11px;color:var(--text-dim);margin-bottom:10px}
.city-card .temp{font-size:36px;font-weight:700;color:#fff}
.city-card .temp .unit{font-size:18px;color:var(--text-dim)}
.city-card .details{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-dim)}
.city-card .details span{display:flex;align-items:center;gap:4px}
.forecast-panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:28px}
.forecast-panel.active{display:block}
.forecast-panel h2{font-size:16px;color:#fff;margin-bottom:16px}
.forecast-panel h2 .close{float:right;cursor:pointer;color:var(--text-dim);font-size:18px}
.forecast-panel h2 .close:hover{color:var(--accent)}
.forecast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fcast-card{background:rgba(0,0,0,.25);border-radius:10px;padding:14px;text-align:center}
.fcast-card .time{font-size:11px;color:var(--text-dim);margin-bottom:6px}
.fcast-card .temp-f{font-size:22px;font-weight:600;color:#fff}
.fcast-card .cond{font-size:11px;color:var(--text-dim);margin-top:4px}
.fcast-card .precip{font-size:11px;color:var(--rain);margin-top:2px}
.advisories{margin-bottom:28px}
.advisories h2{font-size:14px;color:var(--accent);margin-bottom:10px}
.advisory{background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.2);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:13px}
.advisory .title{font-weight:600;color:var(--storm)}
.advisory .desc{color:var(--text-dim);margin-top:4px;font-size:12px}
.loading{text-align:center;padding:60px;color:var(--text-dim)}.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:11px;color:var(--text-dim);padding:16px 0;border-top:1px solid var(--border);margin-top:20px}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){.cities-grid{grid-template-columns:repeat(2,1fr)}.city-card .temp{font-size:28px}.forecast-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>PH <span>weather</span></h1>
<div class="sub" id="updateTime">Loading...</div>
</div>
<a href="/stubborn-stats/">stats &rarr;</a>
</header>
<div class="loading" id="loading"><div class="spin"></div><p>Fetching weather data...</p></div>
<div id="content" style="display:none">
<div class="cities-grid" id="cityGrid"></div>
<div class="forecast-panel" id="forecastPanel"></div>
</div>
<footer>Data: <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> (free, no key) &middot; <a href="https://stubborndeveloper.top">&larr; home</a></footer>
</div>
<script>
const CITIES = [
  {name:"Antipolo",region:"Rizal",lat:14.5861,lon:121.1767},
  {name:"Manila",region:"NCR",lat:14.5995,lon:120.9842},
  {name:"Quezon City",region:"NCR",lat:14.676,lon:121.0437},
  {name:"Cebu City",region:"Visayas",lat:10.3157,lon:123.8854},
  {name:"Davao City",region:"Mindanao",lat:7.1907,lon:125.4553},
  {name:"Baguio",region:"Luzon",lat:16.4023,lon:120.596},
  {name:"Iloilo City",region:"Visayas",lat:10.7202,lon:122.5621},
  {name:"Zamboanga City",region:"Mindanao",lat:6.9085,lon:122.0746},
  {name:"Cagayan de Oro",region:"Mindanao",lat:8.4542,lon:124.6319},
  {name:"Tuguegarao",region:"Luzon",lat:17.6133,lon:121.7277},
  {name:"Legazpi",region:"Luzon",lat:13.1388,lon:123.734},
  {name:"Puerto Princesa",region:"Palawan",lat:9.7392,lon:118.7355},
  {name:"Dagupan",region:"Luzon",lat:16.0431,lon:120.3333},
];

const WMO = {
  0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",
  45:"Foggy",48:"Foggy",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",
  61:"Slight rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",
  71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
  80:"Rain showers",81:"Moderate showers",82:"Violent showers",
  85:"Snow showers",86:"Snow showers",
  95:"Thunderstorm",96:"Thunderstorm + hail",99:"Thunderstorm + hail"
};
const WMO_ICON = {0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",61:"🌧",63:"🌧",65:"🌧",80:"🌦",81:"🌦",82:"🌧",95:"⛈",96:"⛈",99:"⛈"};

function wmoIcon(c){return WMO_ICON[c]||"🌡"}
function wmoText(c){return WMO[c]||"Unknown"}

async function fetchWeather(lat,lon){
  const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,pressure_msl"+
    "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m"+
    "&timezone=Asia/Manila&forecast_days=3";
  const r=await fetch(url);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

async function fetchAllCities(){
  return Promise.all(CITIES.map(async(c,i)=>{
    try{
      const d=await fetchWeather(c.lat,c.lon);
      return {city:c,data:d,error:null};
    }catch(e){
      return {city:c,data:null,error:e.message};
    }
  }));
}

function renderCityCard(result){
  const c=result.city, d=result.data;
  const card=document.createElement("div");
  card.className="city-card";
  if(result.error){
    card.innerHTML='<div class=name>'+c.name+'</div><div class=region>'+c.region+'</div><div style=color:var(--storm);font-size:13px>Error</div>';
    return card;
  }
  const cur=d.current;
  const icon=wmoIcon(cur.weather_code);
  const cond=wmoText(cur.weather_code);
  card.innerHTML='<div class=name>'+icon+' '+c.name+'</div><div class=region>'+c.region+'</div><div class=temp>'+Math.round(cur.temperature_2m)+'<span class=unit>°C</span></div><div class=details><span>💧'+cur.relative_humidity_2m+'%</span><span>💨'+Math.round(cur.wind_speed_10m)+'km/h</span><span>🌡'+Math.round(cur.apparent_temperature)+'°</span></div><div style=font-size:12px;color:var(--text-dim);margin-top:4px>'+cond+'</div>';
  card.addEventListener("click",()=>showForecast(c,d));
  return card;
}

function renderCities(results){
  const grid=document.getElementById("cityGrid");
  grid.innerHTML="";
  results.sort((a,b)=>{
    if(a.error&&!b.error)return 1;
    if(!a.error&&b.error)return -1;
    return 0;
  });
  for(const r of results){
    grid.appendChild(renderCityCard(r));
  }
}

function showForecast(city,data){
  const panel=document.getElementById("forecastPanel");
  panel.classList.add("active");
  
  // Get hourly data (next 24 hours)
  const hourly=data.hourly;
  const now=new Date();
  const nowIdx=hourly.time.findIndex(t=>new Date(t)>now);
  const slice=hourly.time.slice(Math.max(0,nowIdx),nowIdx+24);
  
  let html='<h2>'+city.name+' — 3-Day Forecast <span class=close onclick="document.getElementById(\'forecastPanel\').classList.remove(\'active\')\">✕</span></h2><div class=forecast-grid>';
  
  for(let i=Math.max(0,nowIdx);i<Math.min(hourly.time.length,nowIdx+24);i++){
    const time=hourly.time[i];
    const t=Math.round(hourly.temperature_2m[i]);
    const precip=hourly.precipitation_probability[i];
    const wc=hourly.weather_code[i];
    const wind=Math.round(hourly.wind_speed_10m[i]);
    const icon=wmoIcon(wc);
    
    // Format time
    const dt=new Date(time);
    const h=dt.getHours();
    const ampm=h>=12?"PM":"AM";
    const h12=h%12||12;
    const day=dt.toLocaleDateString("en-PH",{weekday:"short"});
    
    html+='<div class=fcast-card><div class=time>'+day+' '+h12+ampm+'</div><div class=temp-f>'+icon+' '+t+'°</div><div class=cond>'+wmoText(wc)+'</div>'+(precip>0?'<div class=precip>💧'+precip+'%</div>':'')+'<div style=font-size:10px;color:var(--text-dim)>💨'+wind+'km/h</div></div>';
  }
  
  html+='</div>';
  panel.innerHTML=html;
  
  // Scroll to forecast
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}

async function init(){
  try{
    document.getElementById("loading").style.display="block";
    document.getElementById("content").style.display="none";
    
    const results=await fetchAllCities();
    
    document.getElementById("updateTime").textContent="Updated "+new Date().toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Manila"});
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    
    renderCities(results);
  }catch(e){
    document.getElementById("loading").innerHTML='<p style=color:var(--storm)>Failed to load: '+e.message+'</p>';
  }
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
