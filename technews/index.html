<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Tech News — StubbornDev</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:#00ff8844;color:#fff}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050505;color:#c0c0c0;min-height:100vh;padding:24px;overflow-x:hidden}
code,.font-mono{font-family:'JetBrains Mono',monospace}
.container{max-width:800px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.04)}
header h1{font-size:20px;font-weight:700;color:#e0e0e0;letter-spacing:-0.5px}
header h1 .accent{color:#00ff88}
header .subtitle{font-size:11px;color:#6a6a7a;margin-top:3px}
header .back-link a{color:#00aa55;text-decoration:none;font-size:12px}
header .back-link a:hover{color:#00ff88}
.source-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.source-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:rgba(24,24,36,.4);color:#6a6a7a;font-size:11px;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.source-btn:hover{border-color:#00ff8844;color:#c0c0c0}
.source-btn.active{background:#00ff8822;border-color:#00ff8844;color:#00ff88}
.news-list{display:flex;flex-direction:column;gap:8px}
.news-card{background:rgba(24,24,36,.4);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:14px 16px;transition:all .15s;cursor:pointer}
.news-card:hover{border-color:rgba(0,255,136,.2);background:rgba(24,24,36,.6)}
.news-card h3{font-size:13px;font-weight:600;color:#e0e0e0;margin-bottom:4px;line-height:1.4}
.news-card .meta{font-size:10px;color:#6a6a7a;display:flex;gap:10px;flex-wrap:wrap}
.news-card .meta .source{color:#00aa55}
.news-card .meta .date{font-family:'JetBrains Mono',monospace}
.news-card .desc{font-size:11px;color:#6a6a7a;margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status-bar{display:flex;justify-content:space-between;font-size:10px;color:#6a6a7a;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
.loading{text-align:center;padding:40px;color:#6a6a7a;font-size:12px}
.loading .spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.06);border-top-color:#00ff88;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:20px;color:#6a6a7a;font-size:11px}
.error a{color:#00aa55}
.status-feed{font-size:10px;color:#6a6a7a;display:inline-block;margin-left:6px}
.status-feed.ok{color:#00ff8866}
.status-feed.fail{color:#ff446666}
footer{text-align:center;font-size:11px;color:#6a6a7a;padding:18px 0;margin-top:24px;border-top:1px solid rgba(255,255,255,.04)}
footer a{color:#00aa55;text-decoration:none}
footer a:hover{color:#00ff88}
@media(max-width:600px){body{padding:14px}.source-bar{gap:4px}.source-btn{font-size:10px;padding:4px 8px}}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1><span class="accent">tech</span>news</h1>
<div class="subtitle">PH tech from RSS feeds</div>
</div>
<div class="back-link"><a href="/">← portfolio</a></div>
</header>

<div class="status-bar">
<span id="feedStatus"><span class="spin" style="width:10px;height:10px;display:inline-block;border-width:1.5px;margin:0 4px 0 0;vertical-align:middle"></span> Loading feeds...</span>
<span id="updatedText">—</span>
</div>

<div class="source-bar" id="sourceBar"></div>

<div class="news-list" id="newsList"></div>

<footer><a href="https://github.com/TheRealStubbornDeveloper">@TheRealStubbornDeveloper</a></footer>
</div>

<script>
var FEEDS = [
  { id: 'bitpinas', name: 'BitPinas', url: 'https://bitpinas.com/feed/' },
  { id: 'yugatech', name: 'YugaTech', url: 'https://www.yugatech.com/feed/' },
  { id: 'noypi', name: 'NoypiGeeks', url: 'https://noypigeeks.com/feed/' },
  { id: 'technobaboy', name: 'Technobaboy', url: 'https://www.technobaboy.com/feed' }
];

var state = {
  articles: [],
  activeSource: null,
  feedOk: {},
  loading: false
};

function $(id) { return document.getElementById(id); }

function fmtTime(d) {
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function fetchFeed(feed) {
  // Use rss2json — purpose-built RSS-to-JSON with CORS support
  var url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
  var r = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var data = await r.json();
  if (data.status !== 'ok') throw new Error(data.message || 'Parse failed');
  return (data.items || []).map(function(item) {
    var desc = (item.description || '').replace(/<[^>]*>/g, '').trim().slice(0, 300);
    var date = new Date(item.pubDate || item.published || Date.now());
    return {
      title: item.title || '(no title)',
      link: item.link || '',
      desc: desc,
      date: isNaN(date.getTime()) ? new Date() : date,
      source: feed.name,
      sourceId: feed.id
    };
  }).filter(function(a) { return a.title && a.link; });
}

async function loadFeeds() {
  if (state.loading) return;
  state.loading = true;

  var feeds = state.activeSource
    ? FEEDS.filter(function(f) { return f.id === state.activeSource; })
    : FEEDS.slice();

  // Show loading state
  $('feedStatus').innerHTML = '<span class="spin" style="width:10px;height:10px;display:inline-block;border-width:1.5px;margin:0 4px 0 0;vertical-align:middle"></span> Loading ' + feeds.length + ' feed' + (feeds.length > 1 ? 's' : '') + '...';
  $('newsList').innerHTML = '';

  // Fire all fetches in parallel
  var promises = feeds.map(function(feed) {
    return fetchFeed(feed).then(function(articles) {
      state.feedOk[feed.id] = true;
      return { feed: feed, articles: articles, error: null };
    }).catch(function(err) {
      state.feedOk[feed.id] = false;
      return { feed: feed, articles: [], error: err.message };
    });
  });

  // Show results as they come in (Promise.settle pattern)
  var allResults = await Promise.allSettled(promises);
  var allArticles = [];
  var ok = 0, fail = 0;

  allResults.forEach(function(result) {
    if (result.status === 'fulfilled') {
      var r = result.value;
      if (r.error) {
        fail++;
      } else {
        ok++;
        allArticles = allArticles.concat(r.articles);
      }
    } else {
      fail++;
    }
  });

  // Sort by date
  allArticles.sort(function(a, b) { return b.date - a.date; });
  state.articles = allArticles;
  state.loading = false;

  // Update status
  var statusHtml = '';
  if (ok === 0 && fail > 0) {
    statusHtml = '<span style="color:#ff446666">All feeds failed</span>';
  } else {
    statusHtml = ok + '/' + feeds.length + ' feeds';
    FEEDS.forEach(function(f) {
      var okState = state.feedOk[f.id];
      if (okState === true) statusHtml += '<span class="status-feed ok">●</span>';
      else if (okState === false) statusHtml += '<span class="status-feed fail">●</span>';
    });
  }
  $('feedStatus').textContent = statusHtml + ' (' + allArticles.length + ' articles)';
  $('updatedText').textContent = new Date().toLocaleTimeString();

  // Render
  render(allArticles);
}

function render(articles) {
  var list = $('newsList');
  if (!articles.length) {
    list.innerHTML = '<div class="error">No articles loaded. <a href="#" onclick="location.reload();return false">Retry</a></div>';
    return;
  }
  list.innerHTML = articles.map(function(a) {
    return '<a href="' + a.link + '" target="_blank" class="news-card" rel="noopener">' +
      '<h3>' + esc(a.title) + '</h3>' +
      (a.desc ? '<div class="desc">' + esc(a.desc) + '</div>' : '') +
      '<div class="meta"><span class="source">' + a.source + '</span><span class="date">' + fmtTime(a.date) + '</span></div>' +
      '</a>';
  }).join('');
}

function esc(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderSourceBar() {
  var bar = $('sourceBar');
  bar.innerHTML = '<button class="source-btn' + (!state.activeSource ? ' active' : '') + '" data-source="">All</button>' +
    FEEDS.map(function(f) {
      return '<button class="source-btn' + (state.activeSource === f.id ? ' active' : '') + '" data-source="' + f.id + '">' + f.name + '</button>';
    }).join('');
  bar.querySelectorAll('.source-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.activeSource = this.getAttribute('data-source') || null;
      renderSourceBar();
      loadFeeds();
    });
  });
}

renderSourceBar();
loadFeeds();
setInterval(loadFeeds, 300000);
</script>
</body>
</html>
