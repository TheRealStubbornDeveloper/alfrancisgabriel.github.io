<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StubbornDeveloper · Repo Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0f;--card:#12121a;--border:#1a1a2e;--accent:#00ff88;--accent-dim:#00aa55;--text:#c8c8d4;--text-dim:#6a6a7a;--red:#ff4466;--blue:#4488ff;--yellow:#ffcc44}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.container{max-width:1280px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--border)}
header h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-0.5px}
header h1 span{color:var(--text)}
header .subtitle{font-size:13px;color:var(--text-dim);margin-top:4px}
header .back-link{font-size:13px}
header .back-link a{color:var(--accent-dim);text-decoration:none}
header .back-link a:hover{color:var(--accent)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.summary-card .value{font-size:24px;font-weight:700;color:#fff}
.summary-card .accent{color:var(--accent)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h3{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.chart-wrap{position:relative;height:260px}
.repos-section h2{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--accent)}
.repo-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.repo-row{display:grid;grid-template-columns:2fr 80px 80px 100px 50px;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .15s}
.repo-row:last-child{border-bottom:none}
.repo-row:hover{background:rgba(0,255,136,.03)}
.repo-row.header{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;cursor:default}
.repo-row.header:hover{background:transparent}
.repo-name{font-weight:600;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-desc{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-stat{font-size:12px;text-align:center}
.repo-stat .num{color:#fff;font-weight:600}
.repo-star{color:var(--yellow)}
.repo-lang{font-size:11px;text-align:center;color:var(--text-dim)}
.detail-panel{display:none;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);padding:16px 20px;grid-template-columns:1fr 1fr;gap:16px}
.detail-panel.active{display:grid}
.detail-panel h4{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.detail-chart{position:relative;height:140px}
.lang-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lang-tags span{font-size:10px;color:var(--text-dim)}
.lang-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.loading{text-align:center;padding:60px 20px;color:var(--text-dim)}
.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:11px;color:var(--text-dim);padding:20px 0;margin-top:28px;border-top:1px solid var(--border)}
footer a{color:var(--accent-dim);text-decoration:none}
@media(max-width:700px){.chart-grid{grid-template-columns:1fr}.repo-row{grid-template-columns:1.5fr 60px 60px 70px}.repo-row .repo-stat.repo-link-col{display:none}.detail-panel.active{grid-template-columns:1fr}body{padding:16px}.summary-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>gh:<span>stubborn</span> <span style="color:var(--text-dim)">&#183;</span> <span style="color:var(--accent)">analytics</span></h1>
<div class="subtitle">Updated <span id="update-time">&#8212;</span></div>
</div>
<div class="back-link"><a href="/">&larr; portfolio</a></div>
</header>
<div class="summary-grid" id="summaryGrid"></div>
<div class="chart-grid">
<div class="card"><h3>Languages</h3><div class="chart-wrap"><canvas id="langChart"></canvas></div></div>
<div class="card"><h3>Stars per Repository</h3><div class="chart-wrap"><canvas id="starsChart"></canvas></div></div>
</div>
<div class="repos-section">
<h2 id="repoCount">Repositories</h2>
<div class="repo-table" id="repoTable"></div>
</div>
<footer><a href="https://github.com/TheRealStubbornDeveloper" target="_blank">@TheRealStubbornDeveloper  &middot;  <span id="update-time2"></span></a></footer>
</div>

<script>
const LANG_COLORS = {
  'Python': '#3572A5',
  'JavaScript': '#f1e05a',
  'TypeScript': '#3178C6',
  'HTML': '#e34c26',
  'CSS': '#563d7c',
  'SCSS': '#c6538c',
  'Kotlin': '#A97BFF',
  'Go': '#00ADD8',
  'Java': '#b07219',
  'C': '#555555',
  'C++': '#f34b7d',
  'PHP': '#4F5D95',
  'Shell': '#89e051',
  'Dockerfile': '#384d54',
  'Jupyter Notebook': '#DA5B0F',
  'Rust': '#dea584'
};

function fmt(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

async function loadJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(url + ' returned ' + resp.status);
  return resp.json();
}

function renderSummary(s) {
  document.getElementById('update-time').textContent = (s.updated_at || '').slice(0, 10);
  var el = document.getElementById('update-time2');
  if (el) el.textContent = (s.updated_at || '').slice(0, 10);

  var grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';
  var cards = [
    { label: 'Repos', value: s.total_repos, accent: false },
    { label: 'Stars', value: fmt(s.total_stars), accent: true },
    { label: 'Forks', value: fmt(s.total_forks), accent: false },
    { label: 'Top Language', value: s.top_language || '&mdash;', accent: true },
    { label: 'Languages', value: s.languages_used, accent: false },
    { label: 'Size', value: s.total_size_mb + 'MB', accent: false }
  ];
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    var div = document.createElement('div');
    div.className = 'summary-card';
    div.innerHTML = '<div class="label">' + c.label + '</div>' +
      '<div class="value' + (c.accent ? ' accent' : '') + '">' + c.value + '</div>';
    grid.appendChild(div);
  }
}

function renderLangChart(langs) {
  var ctx = document.getElementById('langChart');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: langs.map(function(l) { return l.name; }),
      datasets: [{
        data: langs.map(function(l) { return l.bytes; }),
        backgroundColor: langs.map(function(l) {
          return LANG_COLORS[l.name] || '#666666';
        }),
        borderColor: '#12121a',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#c8c8d4', font: { size: 11 }, padding: 10, usePointStyle: true }
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var l = langs[ctx.dataIndex];
              return ' ' + l.name + ': ' + (l.bytes / 1024).toFixed(0) + ' KB (' + l.pct + '%)';
            }
          }
        }
      }
    }
  });
}

function renderStarsChart(repos) {
  var ctx = document.getElementById('starsChart');
  if (!ctx) return;
  var top15 = repos.slice(0, 15);
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: top15.map(function(r) {
        return r.name.length > 16 ? r.name.slice(0, 14) + '\u2026' : r.name;
      }),
      datasets: [{
        label: 'Stars',
        data: top15.map(function(r) { return r.stars; }),
        backgroundColor: top15.map(function(r) {
          return r.stars > 0 ? '#00ff88' : '#1a3a2a';
        }),
        borderRadius: 3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: '#6a6a7a', font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        y: {
          ticks: { color: '#c8c8d4', font: { size: 10 } },
          grid: { display: false }
        }
      }
    }
  });
}

function renderRepoTable(repos) {
  document.getElementById('repoCount').textContent = 'Repositories (' + repos.length + ')';

  var table = document.getElementById('repoTable');
  table.innerHTML = '';

  // Header
  var header = document.createElement('div');
  header.className = 'repo-row header';
  header.innerHTML = '<div>Repository</div><div style="text-align:center">Stars</div><div style="text-align:center">Forks</div><div style="text-align:center">Language</div><div></div>';
  table.appendChild(header);

  // Rows
  for (var i = 0; i < repos.length; i++) {
    var r = repos[i];
    var row = document.createElement('div');
    row.className = 'repo-row';
    row.setAttribute('data-repo', encodeURIComponent(JSON.stringify(r)));
    row.innerHTML = [
      '<div><div class="repo-name">' + esc(r.name) + '</div>',
      '<div class="repo-desc">' + (r.description ? esc(r.description) : '\u2014') + '</div></div>',
      '<div class="repo-stat repo-star"><span class="num">' + r.stars + '</span></div>',
      '<div class="repo-stat"><span class="num">' + r.forks + '</span></div>',
      '<div class="repo-lang">' + (r.language || '\u2014') + '</div>',
      '<div class="repo-stat" style="font-size:11px;color:var(--accent-dim)">\u2197</div>'
    ].join('');

    row.addEventListener('click', createClickHandler(r, row));
    table.appendChild(row);
  }
}

function esc(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function createClickHandler(repo, rowEl) {
  return function() { showDetail(repo, rowEl); };
}

async function showDetail(repo, rowEl) {
  // Remove any active detail panels
  var active = document.querySelectorAll('.detail-panel.active');
  for (var i = 0; i < active.length; i++) {
    active[i].classList.remove('active');
  }

  var panel = rowEl.nextElementSibling;
  if (!panel || !panel.classList.contains('detail-panel')) {
    panel = document.createElement('div');
    panel.className = 'detail-panel';
    rowEl.parentNode.insertBefore(panel, rowEl.nextSibling);
  }
  panel.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  panel.classList.add('active');

  try {
    var url = 'https://api.github.com/repos/TheRealStubbornDeveloper/' + repo.name + '/languages';
    var resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var raw = await resp.json();

    var total = 0;
    var keys = Object.keys(raw);
    for (var i = 0; i < keys.length; i++) {
      total += raw[keys[i]];
    }
    var langList = [];
    for (var i = 0; i < keys.length; i++) {
      var pct = total ? Math.round(raw[keys[i]] / total * 100) : 0;
      langList.push({ name: keys[i], bytes: raw[keys[i]], pct: pct });
    }
    langList.sort(function(a, b) { return b.bytes - a.bytes; });

    // Build the languages mini chart HTML
    var langTags = '';
    for (var i = 0; i < Math.min(langList.length, 8); i++) {
      var l = langList[i];
      var color = LANG_COLORS[l.name] || '#666666';
      langTags += '<span><span class="lang-dot" style="background:' + color + '"></span>' +
        esc(l.name) + ' ' + l.pct + '%</span>';
    }

    panel.innerHTML = [
      '<div><h4>Languages</h4><div class="detail-chart"><canvas id="dl-' + repo.name + '"></canvas></div>',
      '<div class="lang-tags">' + langTags + '</div></div>',
      '<div><h4>About</h4>',
      '<p style="font-size:12px;color:var(--text-dim);line-height:1.5">' + (repo.description ? esc(repo.description) : 'No description') + '</p>',
      '<p style="margin-top:8px;font-size:11px;color:var(--text-dim)">',
      'Created ' + (repo.created_at || '').slice(0, 10) + ' &middot; Updated ' + (repo.updated_at || '').slice(0, 10),
      '</p>',
      '<p style="margin-top:4px"><a href="' + repo.url + '" target="_blank" style="color:var(--accent-dim);font-size:12px">github.com/' + repo.name + ' &nearr;</a></p>',
      '</div>'
    ].join('');

    var miniCtx = document.getElementById('dl-' + repo.name);
    if (miniCtx && langList.length > 0) {
      new Chart(miniCtx.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: langList.map(function(l) { return l.name; }),
          datasets: [{
            data: langList.map(function(l) { return l.bytes; }),
            backgroundColor: langList.map(function(l) {
              return LANG_COLORS[l.name] || '#666666';
            }),
            borderColor: 'rgba(0,0,0,0.3)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }
  } catch (e) {
    panel.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--red)">Failed to load details</div>';
    console.error(e);
  }
}

async function init() {
  try {
    var [summary, repos, langs] = await Promise.all([
      loadJSON('data/summary.json'),
      loadJSON('data/repos.json'),
      loadJSON('data/languages.json')
    ]);
    renderSummary(summary);
    renderLangChart(langs);
    renderStarsChart(repos);
    renderRepoTable(repos);
  } catch (e) {
    document.querySelector('.container').innerHTML =
      '<div style="text-align:center;padding:80px 20px">' +
      '<h2 style="color:var(--red);margin-bottom:12px">Data not loaded</h2>' +
      '<p style="color:var(--text-dim)">' + esc(e.message) + '</p>' +
      '<p style="margin-top:8px;color:var(--text-dim);font-size:13px">' +
      'Run <code style="background:var(--card);padding:2px 8px;border-radius:4px">python3 scripts/fetch-data.py</code> first.' +
      '</p></div>';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
